<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbeitsanweisung</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
}

.row{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}

.step{
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
    box-sizing:border-box;
}

img{
    max-width:100%;
    margin-top:10px;
    border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>Arbeitsanweisung</h1>

<div class="row">
<label>Ersteller</label>
<input type="text" id="ersteller">
</div>

<div class="row">
<label>Anlage</label>
<input type="text" id="anlage">
</div>

<div class="row">
<label>Artikel</label>
<input type="text" id="artikel">
</div>

<div class="row">
<label>Datum</label>
<input type="date" id="datum">
</div>

<button onclick="addStep()">
+ Schritt hinzufügen
</button>

<div id="steps"></div>

</div>

<script>

let stepCounter = 0;

function addStep(){

    stepCounter++;

    const step = document.createElement("div");

    step.className = "step";

    step.innerHTML = `
        <h2>Schritt ${stepCounter}</h2>

        <label>Beschreibung</label>

        <textarea></textarea>

        <label>Foto aufnehmen / auswählen</label>

        <input type="file"
               accept="image/*"
               capture="environment">

        <div class="preview"></div>
    `;

    const fileInput = step.querySelector("input[type=file]");
    const preview = step.querySelector(".preview");

    fileInput.addEventListener("change", function(){

        const file = this.files[0];

        if(!file) return;

        const reader = new FileReader();

        reader.onload = function(event){

    const img = document.createElement("img");

    img.src = event.target.result;

    img.style.maxWidth = "100%";
    img.style.borderRadius = "8px";

    preview.innerHTML = "";
    preview.appendChild(img);

};

        reader.readAsDataURL(file);

    });

    document
        .getElementById("steps")
        .appendChild(step);
}

</script>

</body>
</html>
