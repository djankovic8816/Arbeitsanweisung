<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitsanweisung V9</title>
<style>
body{font-family:Arial,sans-serif;margin:10px;background:#f4f4f4}
.container{max-width:1300px;margin:auto;background:#fff;padding:15px}
.header{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px}
textarea{min-height:180px;resize:none;overflow:hidden}
.step{border:1px solid #ccc;padding:15px;margin-top:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.textCol{padding-right:15px;border-right:3px solid #666}
.imageCol{padding-left:15px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gallery img{width:100%;max-height:250px;object-fit:contain;border:1px solid #ccc}
.printText{display:none;white-space:pre-wrap}
button{padding:12px 16px;margin:5px;font-size:16px}
@media (max-width:768px){
.header{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.textCol{border-right:none;border-bottom:3px solid #666;padding-right:0;padding-bottom:15px}
.imageCol{padding-left:0;padding-top:15px}
}
@media print{
.controls,.deleteBtn,.imgbtn,.fileInput,textarea{display:none!important}
.printText{display:block!important}
.grid{grid-template-columns:1fr 1fr!important}
.textCol{border-right:3px solid #666!important;border-bottom:none!important;padding-right:15px!important}
.imageCol{padding-left:15px!important;padding-top:0!important}
}
</style>
</head>
<body>
<div class='container'>
<h1>Arbeitsanweisung</h1>
<div class='header'>
<div><label>Ersteller</label><input></div>
<div><label>Anlage</label><input></div>
<div><label>Artikel</label><input></div>
<div><label>Datum</label><input type='date'></div>
</div>
<div class='controls'>
<button id='addBtn'>Schritt hinzufügen</button>
<button onclick='preparePrint();window.print();'>Drucken / PDF</button>
</div>
<div id='steps'></div>
</div>
<script>
const steps=document.getElementById('steps');
function grow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';saveData();}
function renumber(){document.querySelectorAll('.title').forEach((e,i)=>e.textContent='Schritt '+(i+1));saveData();}
function preparePrint(){document.querySelectorAll('.step').forEach(s=>{s.querySelector('.printText').textContent=s.querySelector('textarea').value;});}
function resizeImage(file,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);}

function addStep(text=''){
const d=document.createElement('div');
d.className='step';
const header=document.createElement('div');
header.style.display='flex';header.style.justifyContent='space-between';
const title=document.createElement('h3');title.className='title';
const del=document.createElement('button');del.textContent='Löschen';del.className='deleteBtn';
header.append(title,del);

const grid=document.createElement('div');grid.className='grid';
const textCol=document.createElement('div');textCol.className='textCol';
const ta=document.createElement('textarea');ta.placeholder='Beschreibung des Arbeitsschrittes...';ta.value=text;
const pt=document.createElement('div');pt.className='printText';
textCol.append(ta,pt);

const imageCol=document.createElement('div');imageCol.className='imageCol';
const addImg=document.createElement('button');addImg.textContent='Bild hinzufügen';addImg.className='imgbtn';
const fi=document.createElement('input');fi.type='file';fi.multiple=true;fi.accept='image/*';fi.capture='environment';fi.className='fileInput';fi.style.display='none';
const gallery=document.createElement('div');gallery.className='gallery';
imageCol.append(addImg,fi,gallery);

grid.append(textCol,imageCol);
d.append(header,grid);
steps.appendChild(d);

ta.addEventListener('input',()=>grow(ta));
del.onclick=()=>{d.remove();renumber();};
addImg.onclick=()=>fi.click();
fi.onchange=(e)=>{Array.from(e.target.files).forEach(f=>resizeImage(f,data=>{const img=document.createElement('img');img.src=data;gallery.appendChild(img);saveData();}));};
renumber();grow(ta);
}

  
function saveData(){
localStorage.setItem('aw_v9',steps.innerHTML);
}

function loadData(){
if(localStorage.getItem('aw_v9')){
steps.innerHTML=localStorage.getItem('aw_v9');
} else {
addStep();
}
}

document.getElementById('addBtn').addEventListener('click',()=>addStep());
loadData();
if(steps.children.length===0)addStep();
</script>
</body>
</html>
