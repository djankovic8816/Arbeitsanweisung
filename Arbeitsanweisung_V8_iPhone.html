<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitsanweisung V8 iPhone</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f4f4}
.container{max-width:1300px;margin:auto;background:#fff;padding:20px}
.header{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px}
textarea{min-height:180px;resize:none;overflow:hidden}
.step{border:1px solid #ccc;padding:15px;margin-top:15px;break-inside:avoid;page-break-inside:avoid}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.textCol{padding-right:15px;border-right:3px solid #666}
.imageCol{padding-left:15px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gallery img{width:100%;max-height:250px;object-fit:contain;border:1px solid #ccc}
.printText{display:none;white-space:pre-wrap;word-break:break-word}
button{padding:12px 16px;margin:5px;font-size:16px}

@media (max-width:768px){
.header{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
.textCol{border-right:none;border-bottom:3px solid #666;padding-right:0;padding-bottom:15px}
.imageCol{padding-left:0;padding-top:15px}
}

@media print{
.controls,.deleteBtn,.imgbtn,input[type=file],textarea{display:none!important}
.printText{display:block!important}
.step{break-inside:avoid;page-break-inside:avoid}
body{background:#fff;margin:0}
.gallery img{max-height:220px}
.grid{grid-template-columns:1fr 1fr!important}
.textCol{border-right:3px solid #666!important;border-bottom:none!important;padding-right:15px!important;padding-bottom:0!important}
.imageCol{padding-left:15px!important;padding-top:0!important}
}
</style>
</head>
<body>
<div class="container">
<h1>Arbeitsanweisung</h1>
<div class="header">
<div><label>Ersteller</label><input></div>
<div><label>Anlage</label><input></div>
<div><label>Artikel</label><input></div>
<div><label>Datum</label><input type="date"></div>
</div>
<div class="controls">
<button id="addBtn">Schritt hinzufügen</button>
<button onclick="preparePrint();window.print();">Drucken / Als PDF speichern</button>
</div>
<div id="steps"></div>
</div>
<script>
const steps=document.getElementById('steps');
function grow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';}
function renumber(){document.querySelectorAll('.title').forEach((e,i)=>e.textContent='Schritt '+(i+1));}
function preparePrint(){document.querySelectorAll('.step').forEach(s=>{s.querySelector('.printText').textContent=s.querySelector('textarea').value;});}
function resizeImage(file,cb){const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,max=1200;if(w>max){h=h*max/w;w=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.8));};img.src=e.target.result;};r.readAsDataURL(file);}
function addStep(){const d=document.createElement('div');d.className='step';d.innerHTML='<div style="display:flex;justify-content:space-between"><h3 class="title"></h3><button type="button" class="deleteBtn">Löschen</button></div><div class="grid"><div class="textCol"><textarea placeholder="Beschreibung des Arbeitsschrittes..."></textarea><div class="printText"></div></div><div class="imageCol"><button type="button" class="imgbtn">Bild hinzufügen</button><input type="file" multiple accept="image/*" hidden><div class="gallery"></div></div></div>';steps.appendChild(d);const ta=d.querySelector('textarea');ta.oninput=()=>grow(ta);grow(ta);d.querySelector('.deleteBtn').onclick=()=>{d.remove();renumber();};const fi=d.querySelector('input');d.querySelector('.imgbtn').onclick=()=>fi.click();fi.onchange=e=>Array.from(e.target.files).forEach(f=>resizeImage(f,data=>{const img=document.createElement('img');img.src=data;d.querySelector('.gallery').appendChild(img);}));renumber();}
document.getElementById('addBtn').onclick=addStep;addStep();
</script>
</body>
</html>
